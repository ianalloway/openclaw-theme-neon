name: Animation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  openclaw-plugin:
    name: OpenClaw plugin themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned OpenClaw
        run: >-
          npm install --prefix "$RUNNER_TEMP/openclaw" --no-save --no-audit --no-fund
          --ignore-scripts --loglevel=error "openclaw@$(cat .openclaw-version)"
      - name: Check themes (freshness, contrast, OpenClaw load)
        run: node scripts/check-plugin.mjs "$RUNNER_TEMP/openclaw/node_modules/openclaw/openclaw.mjs"
      - name: Preview against openclaw@latest (informational)
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/openclaw-latest" --no-save --no-audit --no-fund \
            --ignore-scripts --loglevel=error openclaw@latest
          node scripts/check-plugin.mjs "$RUNNER_TEMP/openclaw-latest/node_modules/openclaw/openclaw.mjs"
